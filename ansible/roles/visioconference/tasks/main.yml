---
# Jitsi Meet installe sans interaction : les deux questions du paquet, nom de
# domaine et certificat, recoivent leur reponse a l'avance par debconf.

- name: Prerequis presents
  ansible.builtin.apt:
    name: "{{ visioconference_paquets_prerequis }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [visio, paquets]

- name: Cle du depot Jitsi
  ansible.builtin.get_url:
    url: https://download.jitsi.org/jitsi-key.gpg.key
    dest: /tmp/jitsi-key.gpg.key
    mode: "0644"
  tags: [visio, depot]

- name: Cle du depot convertie
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /usr/share/keyrings/jitsi-keyring.gpg /tmp/jitsi-key.gpg.key
    creates: /usr/share/keyrings/jitsi-keyring.gpg
  tags: [visio, depot]

- name: Depot Jitsi declare
  ansible.builtin.deb822_repository:
    name: jitsi-stable
    types: [deb]
    uris: https://download.jitsi.org
    suites: [stable/]
    signed_by: /usr/share/keyrings/jitsi-keyring.gpg
    state: present
    enabled: true
  tags: [visio, depot]

- name: Nom de domaine transmis a l'avance
  ansible.builtin.debconf:
    name: jitsi-meet
    question: jitsi-meet/cert-choice
    vtype: select
    value: >-
      {{ 'Generate a new self-signed certificate (You will later get a chance to obtain a Let''s encrypt certificate)'
         if visioconference_certificat == 'auto-signe'
         else 'I want to use my own certificate' }}
  tags: [visio, installation]

- name: Nom d'hote du videobridge transmis a l'avance
  ansible.builtin.debconf:
    name: jitsi-videobridge
    question: jitsi-videobridge/jvb-hostname
    vtype: string
    value: "{{ visioconference_domaine }}"
  tags: [visio, installation]

- name: Jitsi Meet installe
  ansible.builtin.apt:
    name: jitsi-meet
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  notify: Redemarrer jitsi
  tags: [visio, installation]

- name: Les trois composants tournent
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - prosody
    - jicofo
    - jitsi-videobridge2
  tags: [visio, service]

- name: Acces web ouvert aux postes de travail
  community.general.ufw:
    rule: allow
    port: "{{ visioconference_port_web }}"
    proto: tcp
    src: "{{ item }}"
    comment: Acces web et signalisation
  loop: "{{ visioconference_reseaux_autorises }}"
  tags: [visio, parefeu]

- name: Flux media ouverts
  community.general.ufw:
    rule: allow
    port: "{{ visioconference_port_media }}"
    proto: udp
    comment: Flux audio et video du videobridge
  tags: [visio, parefeu]

- name: Repli TCP ouvert quand l'UDP est bloque
  community.general.ufw:
    rule: allow
    port: "{{ visioconference_port_repli }}"
    proto: tcp
    comment: Repli du videobridge
  tags: [visio, parefeu]

- name: Le service web repond
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ visioconference_port_web }}"
    timeout: 60
  tags: [visio, verification]
