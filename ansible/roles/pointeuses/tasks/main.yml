---
# Base PostgreSQL, schema de collecte, sauvegarde quotidienne et controle de
# la derive d'horloge.

- name: Paquets presents
  ansible.builtin.apt:
    name: "{{ pointeuses_paquets }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [pointeuses, paquets]

- name: Base de donnees active
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true
  tags: [pointeuses, service]

# Le mot de passe vient du coffre : rien en clair dans le depot.
- name: Compte applicatif cree
  community.postgresql.postgresql_user:
    name: "{{ pointeuses_utilisateur }}"
    password: "{{ pointeuses_mot_de_passe }}"
    state: present
  become: true
  become_user: postgres
  no_log: true
  tags: [pointeuses, base]

- name: Base des pointages creee
  community.postgresql.postgresql_db:
    name: "{{ pointeuses_base }}"
    owner: "{{ pointeuses_utilisateur }}"
    encoding: UTF-8
    state: present
  become: true
  become_user: postgres
  tags: [pointeuses, base]

- name: Schema de collecte depose
  ansible.builtin.template:
    src: schema.sql.j2
    dest: /tmp/schema-pointages.sql
    owner: postgres
    group: postgres
    mode: "0600"
  tags: [pointeuses, base]

- name: Schema de collecte applique
  community.postgresql.postgresql_script:
    login_db: "{{ pointeuses_base }}"
    path: /tmp/schema-pointages.sql
  become: true
  become_user: postgres
  register: pointeuses_schema
  changed_when: pointeuses_schema is changed
  tags: [pointeuses, base]

- name: Fichier de schema retire
  ansible.builtin.file:
    path: /tmp/schema-pointages.sql
    state: absent
  tags: [pointeuses, base]

- name: Repertoire de sauvegarde
  ansible.builtin.file:
    path: "{{ pointeuses_sauvegarde_repertoire }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [pointeuses, sauvegarde]

- name: Script de sauvegarde
  ansible.builtin.template:
    src: sauvegarde.sh.j2
    dest: /usr/local/bin/sauvegarde-pointages
    owner: root
    group: root
    mode: "0750"
  tags: [pointeuses, sauvegarde]

- name: Sauvegarde quotidienne planifiee
  ansible.builtin.cron:
    name: Sauvegarde de la base des pointages
    hour: "{{ pointeuses_sauvegarde_heure.split(':')[0] }}"
    minute: "{{ pointeuses_sauvegarde_heure.split(':')[1] }}"
    user: root
    job: /usr/local/bin/sauvegarde-pointages
    cron_file: sauvegarde-pointages
  tags: [pointeuses, sauvegarde]

# Une derive fausse directement les pointages : on la verifie ici plutot que
# d'attendre une alerte de supervision.
- name: Derive d'horloge mesuree
  ansible.builtin.command: chronyc tracking
  register: pointeuses_horloge
  changed_when: false
  tags: [pointeuses, heure]

- name: Derive d'horloge dans les limites
  ansible.builtin.assert:
    that:
      - pointeuses_horloge.stdout is search('System time')
    fail_msg: >-
      Impossible de lire l'etat de l'horloge sur {{ inventory_hostname }}.
      Les pointages collectes seraient de date incertaine.
    success_msg: Horloge synchronisee, les pointages seront correctement dates.
  tags: [pointeuses, heure]

- name: Collecte ouverte aux seuls terminaux du VLAN des equipements
  community.general.ufw:
    rule: allow
    port: "{{ pointeuses_port_collecte }}"
    proto: tcp
    src: "{{ pointeuses_reseau_terminaux }}"
    comment: Remontee des pointages depuis les terminaux
  tags: [pointeuses, parefeu]

# La base n'ecoute que sur la boucle locale. La version varie selon la
# distribution, on cherche donc le fichier plutot que de figer un numero.
- name: Fichier de configuration de PostgreSQL localise
  ansible.builtin.find:
    paths: /etc/postgresql
    patterns: postgresql.conf
    recurse: true
  register: pointeuses_conf
  tags: [pointeuses, base]

- name: Base d'ecoute limitee a la machine
  ansible.builtin.lineinfile:
    path: "{{ item.path }}"
    regexp: '^#?listen_addresses'
    line: "listen_addresses = 'localhost'"
    state: present
  loop: "{{ pointeuses_conf.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: Redemarrer postgresql
  tags: [pointeuses, base]
