---
# Equivalent Windows du role commun : ce qui doit rester vrai sur toutes les
# machines, quel que soit leur service.

# Format Windows, distinct du format IANA utilise cote Linux.
commun_windows_fuseau: Romance Standard Time

# Un role metier peut ajouter un port, jamais en retirer.
commun_windows_ports_ouverts:
  - nom: SSH
    port: 22
    protocole: tcp

commun_windows_desactiver_smb1: true

# Les correctifs sont telecharges puis signales : la machine ne doit pas
# redemarrer sans intervention, sous peine de devenir injoignable.
commun_windows_maj_automatiques: false

# A poser a true pour appliquer les correctifs en attente. Long, et susceptible
# de provoquer un redemarrage.
commun_windows_installer_correctifs: false

commun_windows_dossier_labo: C:\ProgramData\labo-airbus
