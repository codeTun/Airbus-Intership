---
# Le role installe le service d'impression natif de Windows, qui rend deja le
# service attendu, plus IIS et .NET, prerequis de Xerox Workplace Suite.

impression_windows_fonctionnalites:
  - Print-Services
  - Print-Server
  # Impression IPP, exposee par IIS sur /printers.
  - Print-Internet
  # Prerequis Xerox.
  - Web-Server
  - Web-Mgmt-Console
  - Web-Asp-Net45
  - NET-Framework-45-Core
  - NET-Framework-45-ASPNET

# IIS n'attache aucun certificat par defaut : la console IPP repond alors en
# HTTP simple, et l'authentification Windows y fait circuler un mot de passe
# d'administrateur en clair. Un certificat auto-signe suffit a chiffrer le
# transport ; il ne prouve pas l'identite du serveur, ce qui est acceptable sur
# un reseau d'administration mais doit etre dit.
impression_windows_certificat_nom: labo-impression
impression_windows_certificat_annees: 3

impression_windows_ports:
  - nom: IPP et console web
    port: 80
    protocole: tcp
  - nom: IPP chiffre
    port: 443
    protocole: tcp
  - nom: Partage de files SMB
    port: 445
    protocole: tcp
  - nom: Impression brute
    port: 9100
    protocole: tcp

# Pilote livre avec Windows, donc installable sans acces a Internet et sans
# materiel. A remplacer par le pilote Xerox le jour ou le modele d'imprimante
# est arrete : seule cette variable changera.
impression_windows_pilote: Generic / Text Only

# Files d'attente declarees sur le serveur. Aucune imprimante physique n'existe
# dans le laboratoire : le port pointe vers une adresse du VLAN metier, ce qui
# suffit a peupler la console IPP et a demontrer le partage SMB. Un travail
# envoye resterait en attente, limite a enoncer telle quelle.
impression_windows_files:
  - nom: Xerox-Atelier-01
    adresse: 10.10.30.50
    emplacement: Atelier de production
  - nom: Xerox-Bureau-01
    adresse: 10.10.30.51
    emplacement: Bureaux administratifs

impression_windows_commentaire_file: >-
  File de demonstration, aucun materiel raccorde

# Renseigner le jour ou la licence Xerox est obtenue.
impression_windows_installateur_xerox: ""
