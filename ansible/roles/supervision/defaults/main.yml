---
# Centreon ne publie de depot que pour Debian et la famille RHEL. Le role le
# detecte et s'arrete avec un message clair sur les autres distributions.

supervision_version: "24.10"
supervision_distributions_supportees: [Debian]

supervision_paquets_base:
  - apache2
  - mariadb-server
  - python3-pymysql
  - snmp
  - snmpd
  - rsyslog

supervision_port_web: 80
supervision_port_syslog: 514

supervision_seuils:
  processeur: {avertissement: 80, critique: 90}
  memoire: {avertissement: 80, critique: 90}
  disque: {avertissement: 80, critique: 90}

# Sondes propres a chaque groupe, reprises du cahier des charges.
supervision_controles:
  # Machines Windows : des controles de port, valables quel que soit le
  # systeme, plutot que des sondes systemd.
  impression:
    - {nom: Partage de files SMB, commande: check_tcp, argument: "445"}
    - {nom: Impression brute, commande: check_tcp, argument: "9100"}
    - {nom: Console IPP, commande: check_tcp, argument: "80"}
  # Jitsi tourne en conteneurs : on controle Docker et le port web.
  visioconference:
    - {nom: Moteur Docker, commande: check_systemd_service, argument: docker}
    - {nom: Interface web, commande: check_tcp, argument: "443"}
  pointeuses:
    - {nom: Moteur SQL, commande: check_tcp, argument: "1433"}
    - {nom: Terminaux biometriques, commande: check_tcp, argument: "11010"}
  supervision:
    - {nom: Moteur Centreon, commande: check_systemd_service, argument: centengine}
    - {nom: Base Centreon, commande: check_systemd_service, argument: mariadb}

# Delai maximal entre une anomalie et sa notification.
supervision_delai_notification_secondes: 60
