---
# Installe Centreon, recoit les journaux des autres machines, et declare
# chaque machine avec ses sondes. C'est cette derniere partie qui satisfait
# INF-04 : sans elle, Centreon ne surveillerait rien.

# Mieux vaut s'arreter net avec un message utile qu'installer a moitie.
- name: Distribution compatible avec Centreon
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in supervision_distributions_supportees
    fail_msg: >-
      {{ inventory_hostname }} tourne sous {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_version }}, or Centreon ne publie de depot
      que pour {{ supervision_distributions_supportees | join(' et ') }}.
      Solution prevue au cahier des charges : basculer cette seule machine sous
      Debian 12, en renseignant la variable image_supervision dans
      infrastructure/terraform.tfvars, puis relancer terraform apply.
    success_msg: >-
      {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }},
      compatible avec le depot Centreon.
  tags: [supervision, verification]

- name: Paquets de base presents
  ansible.builtin.apt:
    name: "{{ supervision_paquets_base }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [supervision, paquets]

- name: Locale engendree
  community.general.locale_gen:
    name: "{{ supervision_locale }}"
    state: present
  tags: [supervision, paquets]

# innodb_file_per_table et open_files_limit sont exiges par Centreon, et doivent
# etre poses avant l'installation : le paquet verifie ces valeurs.
- name: Reglages MariaDB attendus par Centreon
  ansible.builtin.copy:
    dest: /etc/mysql/mariadb.conf.d/80-centreon.cnf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Genere par Ansible, role supervision. Ne pas modifier a la main.
      [server]
      {% for cle, valeur in supervision_mariadb_reglages.items() %}
      {{ cle }} = {{ valeur }}
      {% endfor %}
  notify: Redemarrer mariadb
  tags: [supervision, base]

# open_files_limit ne peut pas depasser ce que systemd accorde au service, quelle
# que soit la valeur du fichier de configuration. Sans cette derogation, MariaDB
# plafonne bien en dessous des 32000 exiges, et l'installation de Centreon
# s'interrompt en le signalant.
- name: Repertoire de derogation systemd present
  ansible.builtin.file:
    path: /etc/systemd/system/mariadb.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [supervision, base]

- name: Limite de descripteurs relevee pour MariaDB
  ansible.builtin.copy:
    dest: /etc/systemd/system/mariadb.service.d/centreon.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Genere par Ansible, role supervision. Ne pas modifier a la main.
      [Service]
      LimitNOFILE={{ supervision_mariadb_reglages.open_files_limit }}
  notify: Redemarrer mariadb
  tags: [supervision, base]

- name: Definition systemd rechargee
  ansible.builtin.systemd_service:
    daemon_reload: true
  tags: [supervision, base]

# Les reglages doivent etre effectifs avant que le paquet ne les verifie.
- name: Reglages MariaDB appliques sans attendre la fin du role
  ansible.builtin.meta: flush_handlers
  tags: [supervision, base]

- name: Cle du depot Centreon
  ansible.builtin.get_url:
    url: https://apt-key.centreon.com
    dest: /usr/share/keyrings/centreon.asc
    mode: "0644"
  tags: [supervision, depot]

- name: Depot Centreon declare
  ansible.builtin.deb822_repository:
    name: centreon
    types: [deb]
    uris: "https://packages.centreon.com/apt-standard-{{ supervision_version }}-stable/"
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [main]
    signed_by: /usr/share/keyrings/centreon.asc
    state: present
    enabled: true
  tags: [supervision, depot]

# Centreon repartit ses paquets sur deux sources. Celle-ci porte les trois
# bibliotheques Perl dont centreon-gorgone depend et que Debian ne distribue pas :
# libmojo-ioloop-signal-perl, libnet-curl-perl et libssh-session-perl. Sans elle,
# l'installation s'arrete sur "you have held broken packages".
# Le depot PHP de Sury n'est pas necessaire, Debian 12 fournissant PHP 8.2.
- name: Depot des extensions Centreon declare
  ansible.builtin.deb822_repository:
    name: centreon-plugins
    types: [deb]
    uris: https://packages.centreon.com/apt-plugins-stable/
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [main]
    signed_by: /usr/share/keyrings/centreon.asc
    state: present
    enabled: true
  tags: [supervision, depot]

# centreon-mariadb est nomme explicitement : c'est lui qui porte la limite de
# descripteurs de fichiers du service, que le metapaquet seul ne garantit pas.
- name: Centreon installe
  ansible.builtin.apt:
    name: [centreon-mariadb, centreon]
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  notify: Redemarrer centreon
  tags: [supervision, installation]

# Le repertoire n'existe pas avant l'installation, d'ou la place de cette tache.
# Le fichier est fourni rempli par le paquet : on modifie la ligne, on n'ecrase pas.
- name: Fuseau horaire declare a PHP
  ansible.builtin.lineinfile:
    path: "/etc/php/{{ supervision_version_php }}/mods-available/centreon.ini"
    regexp: '^;?\s*date\.timezone'
    line: "date.timezone = {{ fuseau_horaire }}"
    state: present
  notify:
    - Redemarrer php-fpm
    - Redemarrer apache
  tags: [supervision, installation]

- name: Services Centreon actifs
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [apache2, mariadb, cbd, centengine, gorgoned]
  failed_when: false
  tags: [supervision, service]

- name: Repertoire des journaux recus
  ansible.builtin.file:
    path: /var/log/laboratoire
    state: directory
    owner: "{{ supervision_utilisateur_syslog }}"
    group: adm
    mode: "0750"
  tags: [supervision, journaux]

- name: Collecteur syslog configure
  ansible.builtin.template:
    src: collecteur-syslog.conf.j2
    dest: /etc/rsyslog.d/10-collecteur.conf
    owner: root
    group: root
    mode: "0644"
  notify: Redemarrer rsyslog
  tags: [supervision, journaux]

- name: Reception des journaux ouverte au laboratoire
  community.general.ufw:
    rule: allow
    port: "{{ supervision_port_syslog }}"
    proto: "{{ item }}"
    comment: Reception des journaux du laboratoire
  loop: [udp, tcp]
  tags: [supervision, parefeu]

- name: Interface web ouverte
  community.general.ufw:
    rule: allow
    port: "{{ supervision_port_web }}"
    proto: tcp
    comment: Interface web Centreon
  tags: [supervision, parefeu]

# La ligne de commande Centreon est preferee a l'interface web, pour que la
# declaration reste rejouable.
- name: Machines deja connues de Centreon
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o HOST -a show
  register: supervision_hotes_connus
  changed_when: false
  failed_when: false
  no_log: true
  tags: [supervision, hotes]

# L'assistant web fait saisir le mot de passe du compte admin a la main, il ne
# peut donc pas coincider avec celui du coffre. Plutot que d'exiger une saisie
# identique des deux cotes, ce qui echouera toujours, l'empreinte est recalculee
# ici depuis le coffre. Le coffre devient ainsi la seule source de verite.
#
# Le mot de passe transite par l'environnement et non par la ligne de commande :
# il n'apparait donc pas dans la liste des processus. bcrypt cout 10, ce que
# password_hash produit par defaut et ce que Centreon stocke deja.
- name: Mot de passe du compte admin aligne sur le coffre
  ansible.builtin.shell:
    cmd: |
      set -eu
      empreinte=$(php -r 'echo password_hash($argv[1], PASSWORD_DEFAULT);' "$MDP")
      mysql centreon <<SQL
      UPDATE contact_password
         SET password = '$empreinte', creation_date = UNIX_TIMESTAMP()
       WHERE contact_id = (SELECT contact_id FROM contact
                            WHERE contact_alias = '$UTILISATEUR');
      SQL
  environment:
    MDP: "{{ supervision_admin_mot_de_passe }}"
    UTILISATEUR: "{{ supervision_admin }}"
  when: supervision_hotes_connus.rc != 0
  no_log: true
  tags: [supervision, hotes]

# Second essai apres realignement. Sur une plate-forme deja saine, la tache
# precedente est ignoree et celle-ci ne fait que confirmer.
- name: Machines connues de Centreon, apres realignement
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o HOST -a show
  register: supervision_hotes_apres
  changed_when: false
  failed_when: false
  no_log: true
  when: supervision_hotes_connus.rc != 0
  tags: [supervision, hotes]

# Une tache ignoree qui porte register ecrase tout de meme la variable, et le
# resultat n'a alors ni rc ni stdout. D'ou ce choix explicite entre les deux
# tentatives. no_log parce que le resultat conserve la ligne de commande, mot
# de passe compris.
- name: Etat retenu pour la suite
  ansible.builtin.set_fact:
    supervision_hotes: >-
      {{ supervision_hotes_apres if supervision_hotes_apres.rc is defined
         else supervision_hotes_connus }}
  no_log: true
  tags: [supervision, hotes]

# no_log masque le motif des echecs suivants. Ce controle rend un message
# exploitable sans divulguer le mot de passe, et s'arrete avant la boucle.
- name: Ligne de commande Centreon utilisable
  ansible.builtin.assert:
    that:
      - supervision_hotes.rc == 0
    fail_msg: >-
      L'outil en ligne de commande de Centreon a rendu le code
      {{ supervision_hotes.rc | default('inconnu') }}. Deux causes
      possibles. Soit l'assistant web n'a jamais tourne, et il manque alors la
      base, le compte administrateur et /etc/centreon/centreon.conf.php. Soit
      coffre_supervision_mot_de_passe ne correspond pas au mot de passe du
      compte admin choisi pendant cet assistant.
    success_msg: Ligne de commande Centreon operationnelle.
  tags: [supervision, hotes]

# La sonde des services systemd interroge chaque machine par SSH, avec un compte
# sans privileges et une cle qui ne sert qu'a cela. Donner au systeme de
# supervision le compte d'administration lui aurait donne les pleins pouvoirs sur
# tout ce qu'il surveille.
- name: Repertoire SSH du moteur de supervision present
  ansible.builtin.file:
    path: "{{ supervision_cle_privee | dirname }}"
    state: directory
    owner: centreon-engine
    group: centreon-engine
    mode: "0700"
  tags: [supervision, sondes]

- name: Cle dediee a la sonde engendree
  ansible.builtin.command:
    cmd: >-
      ssh-keygen -t ed25519 -N '' -q
      -C "sonde centreon du laboratoire"
      -f {{ supervision_cle_privee }}
    creates: "{{ supervision_cle_privee }}"
  tags: [supervision, sondes]

- name: Droits de la cle de sonde
  ansible.builtin.file:
    path: "{{ item.chemin }}"
    owner: centreon-engine
    group: centreon-engine
    mode: "{{ item.mode }}"
  loop:
    - {chemin: "{{ supervision_cle_privee }}", mode: "0600"}
    - {chemin: "{{ supervision_cle_privee }}.pub", mode: "0644"}
  tags: [supervision, sondes]

- name: Cle publique de la sonde lue
  ansible.builtin.slurp:
    src: "{{ supervision_cle_privee }}.pub"
  register: supervision_cle_publique
  tags: [supervision, sondes]

# delegate_to plutot qu'un play separe : la cle vient d'etre engendree, elle
# n'existerait pas encore si la distribution passait par le role commun, qui
# s'execute avant celui-ci.
- name: Compte de sonde present sur les machines Linux
  ansible.builtin.user:
    name: "{{ supervision_compte_sonde }}"
    comment: Compte de lecture pour la supervision
    shell: /bin/sh
    system: true
    create_home: true
    password: "!"
  delegate_to: "{{ item }}"
  loop: "{{ groups['linux'] | default([]) }}"
  tags: [supervision, sondes]

# Sans ce paquet, les sondes lancees a distance n'existent pas sur la cible.
- name: Sondes standard installees sur les machines observees
  ansible.builtin.apt:
    name: "{{ supervision_paquet_sondes }}"
    state: present
  delegate_to: "{{ item }}"
  loop: "{{ groups['linux'] | default([]) }}"
  tags: [supervision, sondes]

- name: Cle de la sonde autorisee sur les machines Linux
  ansible.posix.authorized_key:
    user: "{{ supervision_compte_sonde }}"
    key: "{{ supervision_cle_publique.content | b64decode }}"
    state: present
  delegate_to: "{{ item }}"
  loop: "{{ groups['linux'] | default([]) }}"
  tags: [supervision, sondes]

# Rien de ce qui suit n'existe sur une plate-forme neuve. Le laboratoire batit
# donc sa propre chaine de supervision, sans dependre d'aucun catalogue.
- name: Commandes de controle connues
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o CMD -a show
  register: supervision_commandes_connues
  changed_when: false
  failed_when: false
  no_log: true
  tags: [supervision, sondes]

# argv plutot qu'une ligne de commande : la definition contient des guillemets
# doubles autour de la commande distante, et un shell les interpreterait en
# fermant la chaine, tronquant la commande a cet endroit. Avec argv, la valeur
# passe telle quelle, sans qu'aucun shell ne la relise.
- name: Commandes de controle du laboratoire declarees
  ansible.builtin.command:
    argv:
      - /usr/share/centreon/bin/centreon
      - -u
      - "{{ supervision_admin }}"
      - -p
      - "{{ supervision_admin_mot_de_passe }}"
      - -o
      - CMD
      - -a
      - add
      - -v
      - "{{ item.nom }};{{ item.type }};{{ item.ligne }}"
  loop: "{{ supervision_commandes }}"
  loop_control:
    label: "{{ item.nom }}"
  when: item.nom not in (supervision_commandes_connues.stdout | default(''))
  register: supervision_ajout_commandes
  failed_when: false
  no_log: true
  notify: Redemarrer centreon
  tags: [supervision, sondes]

# La ligne d'une commande peut changer sans que son nom change : la creation
# seule laisserait alors l'ancienne definition en place indefiniment.
- name: Ligne de chaque commande mise a jour
  ansible.builtin.command:
    argv:
      - /usr/share/centreon/bin/centreon
      - -u
      - "{{ supervision_admin }}"
      - -p
      - "{{ supervision_admin_mot_de_passe }}"
      - -o
      - CMD
      - -a
      - setparam
      - -v
      - "{{ item.nom }};line;{{ item.ligne }}"
  loop: "{{ supervision_commandes }}"
  loop_control:
    label: "{{ item.nom }}"
  changed_when: false
  failed_when: false
  no_log: true
  notify: Redemarrer centreon
  tags: [supervision, sondes]

- name: Modeles d'hote connus
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o HTPL -a show
  register: supervision_modeles_connus
  changed_when: false
  failed_when: false
  no_log: true
  tags: [supervision, sondes]

# Six champs obligatoires, meme vides : nom, alias, adresse, modele parent,
# collecteur et groupe d'hotes. Un modele n'a pas de collecteur, mais le champ
# doit exister, la classe heritant du decoupage des hotes.
- name: Modele d'hote du laboratoire declare
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o HTPL -a add
    -v "{{ supervision_modele_hote }};Modele des machines du laboratoire;;;;"
  when: supervision_modele_hote not in (supervision_modeles_connus.stdout | default(''))
  register: supervision_ajout_modele
  failed_when: false
  no_log: true
  notify: Redemarrer centreon
  tags: [supervision, sondes]

# setparam est declaratif : le rejouer pose la meme valeur, d'ou changed_when a false.
- name: Parametres du modele d'hote poses
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o HTPL -a setparam
    -v "{{ supervision_modele_hote }};{{ item.key }};{{ item.value }}"
  loop: "{{ supervision_modele_parametres | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
  register: supervision_parametres_modele
  changed_when: false
  failed_when: false
  no_log: true
  tags: [supervision, sondes]

# no_log masque la sortie des taches precedentes. Ce controle rend les messages
# de Centreon, qui ne contiennent aucun secret, contrairement a la ligne de
# commande elle-meme.
- name: Chaine de supervision en place
  ansible.builtin.assert:
    that:
      - (supervision_ajout_commandes.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length) == 0
      - (supervision_ajout_modele.rc | default(0)) == 0
      - (supervision_parametres_modele.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length) == 0
    # Les parentheses ne sont pas decoratives : en Jinja le filtre lie plus fort
    # que le plus, donc sans elles seul le dernier terme serait filtre.
    fail_msg: >-
      La construction de la chaine de supervision a echoue. Messages rendus par
      Centreon :
      {{ (
           (supervision_ajout_commandes.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | map(attribute='stdout') | list)
           + (supervision_parametres_modele.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | map(attribute='stdout') | list)
           + [supervision_ajout_modele.stdout | default('')]
         ) | reject('equalto', '') | list | join(' | ') }}
    success_msg: >-
      {{ supervision_commandes | length }} commandes de controle et le modele
      {{ supervision_modele_hote }} sont en place.
  tags: [supervision, sondes]

- name: Machines du laboratoire declarees
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o HOST -a add
    -v "{{ item }};{{ item }};{{ hostvars[item].ansible_host }};{{ supervision_modele_hote }};{{ supervision_collecteur }};"
  loop: "{{ groups['serveurs'] | default([]) }}"
  when: item not in (supervision_hotes.stdout | default(''))
  changed_when: true
  no_log: true
  notify: Redemarrer centreon
  tags: [supervision, hotes]

# Les machines declarees avant l'existence du modele n'en portent aucun, et la
# condition d'idempotence ci-dessus les ignorerait. settemplate est declaratif :
# il pose le modele voulu, que la machine en ait deja un ou non.
- name: Modele applique a chaque machine
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o HOST -a settemplate
    -v "{{ item }};{{ supervision_modele_hote }}"
  loop: "{{ groups['serveurs'] | default([]) }}"
  when: supervision_modele_hote | length > 0
  changed_when: false
  failed_when: false
  no_log: true
  notify: Redemarrer centreon
  tags: [supervision, hotes]

# Sans cette application, la machine herite des parametres du modele mais pas de
# ses services. Sans effet tant que le modele n'en porte aucun, indispensable des
# qu'il en portera.
- name: Services du modele appliques a chaque machine
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o HOST -a applytpl
    -v "{{ item }}"
  loop: "{{ groups['serveurs'] | default([]) }}"
  when: supervision_modele_hote | length > 0
  changed_when: false
  failed_when: false
  no_log: true
  tags: [supervision, hotes]

- name: Modeles de service connus
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o STPL -a show
  register: supervision_modeles_service_connus
  changed_when: false
  failed_when: false
  no_log: true
  tags: [supervision, sondes]

# Trois champs : description, alias, modele parent. Le parent reste vide.
- name: Modeles de service declares
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o STPL -a add
    -v "{{ item.nom }};{{ item.nom }};"
  loop: "{{ supervision_modeles_service }}"
  loop_control:
    label: "{{ item.nom }}"
  when: item.nom not in (supervision_modeles_service_connus.stdout | default(''))
  failed_when: false
  no_log: true
  notify: Redemarrer centreon
  tags: [supervision, sondes]

- name: Commande portee par chaque modele de service
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o STPL -a setparam
    -v "{{ item.nom }};check_command;{{ item.commande }}"
  loop: "{{ supervision_modeles_service }}"
  loop_control:
    label: "{{ item.nom }} -> {{ item.commande }}"
  changed_when: false
  failed_when: false
  no_log: true
  tags: [supervision, sondes]

- name: Parametres communs des modeles de service
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o STPL -a setparam
    -v "{{ item.0.nom }};{{ item.1.key }};{{ item.1.value }}"
  loop: "{{ supervision_modeles_service | product(supervision_modele_service_parametres | dict2items) | list }}"
  loop_control:
    label: "{{ item.0.nom }} : {{ item.1.key }}"
  changed_when: false
  failed_when: false
  no_log: true
  tags: [supervision, sondes]

- name: Correspondance entre machines et sondes
  ansible.builtin.set_fact:
    supervision_affectations: >-
      {{ supervision_affectations | default([]) + [{
           'machine': item,
           'controles': supervision_controles[groupe] | default([])
         }] }}
  vars:
    groupe: >-
      {{ (hostvars[item].group_names | intersect(supervision_controles.keys() | list) | first)
         | default('', true) }}
  loop: "{{ groups['serveurs'] | default([]) }}"
  loop_control:
    label: "{{ item }}"
  tags: [supervision, sondes]

- name: Sondes deja declarees
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o SERVICE -a show
  register: supervision_sondes_connues
  changed_when: false
  failed_when: false
  no_log: true
  tags: [supervision, sondes]

# La condition porte sur le couple machine et description, pas sur la machine
# seule : chercher la machine ferait ignorer toutes ses sondes des qu'elle est
# declaree. La sortie a la forme "id machine;machine;id service;description;...".
- name: Sondes declarees machine par machine
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o SERVICE -a add
    -v "{{ item.0.machine }};{{ item.1.nom }};{{ item.1.modele }}"
  loop: "{{ query('subelements', supervision_affectations, 'controles', {'skip_missing': True}) }}"
  loop_control:
    label: "{{ item.0.machine }} / {{ item.1.nom }}"
  when: >-
    supervision_sondes_connues.stdout_lines | default([])
    | select('search', '^[0-9]+;' ~ item.0.machine ~ ';[0-9]+;' ~ item.1.nom ~ ';')
    | list | length == 0
  register: supervision_ajout_sondes
  failed_when: false
  no_log: true
  notify: Redemarrer centreon
  tags: [supervision, sondes]

# L'argument est passe a la commande par la macro $ARG1$, un numero de port ou un
# nom de service selon le modele. Le point d'exclamation est le separateur de
# Centreon, et non une negation.
- name: Argument de chaque sonde pose
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -o SERVICE -a setparam
    -v "{{ item.0.machine }};{{ item.1.nom }};check_command_arguments;!{{ item.1.argument }}"
  loop: "{{ query('subelements', supervision_affectations, 'controles', {'skip_missing': True}) }}"
  loop_control:
    label: "{{ item.0.machine }} / {{ item.1.nom }} = {{ item.1.argument }}"
  register: supervision_arguments_sondes
  changed_when: false
  failed_when: false
  no_log: true
  notify: Redemarrer centreon
  tags: [supervision, sondes]

# no_log masque tout : ce controle rend les messages de Centreon, qui ne
# contiennent aucun secret, contrairement a la ligne de commande.
- name: Sondes effectivement en place
  ansible.builtin.assert:
    that:
      - (supervision_ajout_sondes.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length) == 0
      - (supervision_arguments_sondes.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length) == 0
    fail_msg: >-
      La declaration des sondes a echoue. Messages rendus par Centreon :
      {{ (
           (supervision_ajout_sondes.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | map(attribute='stdout') | list)
           + (supervision_arguments_sondes.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | map(attribute='stdout') | list)
         ) | reject('equalto', '') | list | join(' | ') }}
    success_msg: >-
      {{ supervision_affectations | map(attribute='controles') | map('length') | sum }}
      sondes reparties sur {{ supervision_affectations | length }} machines.
  tags: [supervision, sondes]

# Le nom du collecteur porte une majuscule. Et sans le controle qui suit, un
# deploiement refuse passerait inapercu : le moteur continuerait de tourner sur
# la configuration livree par le paquet, en ne surveillant rien.
- name: Configuration Centreon deployee vers le collecteur
  ansible.builtin.command: >-
    /usr/share/centreon/bin/centreon -u {{ supervision_admin }}
    -p {{ supervision_admin_mot_de_passe }} -a APPLYCFG
    -v {{ supervision_collecteur }}
  register: supervision_deploiement
  changed_when: true
  failed_when: false
  no_log: true
  tags: [supervision, sondes]

- name: Deploiement accepte par le moteur
  ansible.builtin.assert:
    that:
      # APPLYCFG rend 0 en cas de succes et 1 des qu'une erreur de configuration
      # subsiste. Le code de retour suffit, inutile de chercher un texte.
      - (supervision_deploiement.rc | default(1)) == 0
    fail_msg: >-
      Le deploiement de la configuration a echoue (code
      {{ supervision_deploiement.rc | default('inconnu') }}) :
      {{ supervision_deploiement.stdout | default('aucune sortie') }}
    success_msg: Configuration deployee vers le collecteur {{ supervision_collecteur }}.
  tags: [supervision, sondes]

- name: L'interface web repond
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ supervision_port_web }}/centreon/"
    status_code: [200, 302, 401]
    timeout: 30
  register: supervision_web
  retries: 5
  delay: 10
  until: supervision_web is succeeded
  tags: [supervision, verification]
