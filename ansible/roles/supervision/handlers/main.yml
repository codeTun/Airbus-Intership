---
- name: Redemarrer mariadb
  ansible.builtin.service:
    name: mariadb
    state: restarted

- name: Redemarrer php-fpm
  ansible.builtin.service:
    name: "php{{ supervision_version_php }}-fpm"
    state: restarted
  failed_when: false

- name: Redemarrer apache
  ansible.builtin.service:
    name: apache2
    state: restarted

- name: Redemarrer centreon
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
  loop:
    - cbd
    - centengine
    - gorgoned
  failed_when: false

- name: Redemarrer rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted
