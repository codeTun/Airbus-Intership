---
# MorphoManager exige Windows et SQL Server. Le role installe SQL Server
# Express, gratuit, et prepare la base. MorphoManager est sous abonnement.

# NET-Framework-Core, l'ancien 3.5, reclamerait les sources de l'ISO et
# echouerait. A ajouter avec l'option "source" si MorphoManager l'exige.
pointeuses_windows_fonctionnalites:
  - NET-Framework-45-Core

pointeuses_windows_sql_instance: SQLEXPRESS

# Une instance nommee prend par defaut un port dynamique, different a chaque
# demarrage. Et l'installation silencieuse laisse ici les deux valeurs vides, si
# bien que le moteur n'ecoute sur aucun port TCP. Un port fixe se filtre et se
# supervise, contrairement a un port qui change.
pointeuses_windows_port_sql: 1433
pointeuses_windows_sql_version: "2022"

# Installateur complet, pas le lanceur en ligne : lui seul accepte les
# parametres d'installation silencieuse.
pointeuses_windows_sql_url: >-
  https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SQLEXPR_x64_ENU.exe

# Empreinte a relever au premier telechargement, puis a consigner ici. Tant
# qu'elle est vide, le fichier est installe sans controle d'integrite.
pointeuses_windows_sql_sha256: ""

pointeuses_windows_sql_repertoire: C:\Sources\sqlexpress

pointeuses_windows_ports:
  - nom: Moteur SQL
    port: 1433
    protocole: tcp
  # Port d'ecoute des terminaux MorphoAccess.
  - nom: Terminaux biometriques
    port: 11010
    protocole: tcp

# Renseigner le jour ou l'abonnement Idemia est obtenu.
pointeuses_windows_installateur_morpho: ""
