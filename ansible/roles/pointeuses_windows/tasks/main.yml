---
- name: Secrets fournis par le coffre
  ansible.builtin.assert:
    that:
      - coffre_pointeuses_mot_de_passe is defined
      - coffre_pointeuses_mot_de_passe | length >= 8
      - coffre_windows_admin_mot_de_passe is defined
      - coffre_windows_admin_mot_de_passe | length >= 8
    fail_msg: >-
      Renseignez coffre_pointeuses_mot_de_passe et
      coffre_windows_admin_mot_de_passe dans le coffre Ansible. Le premier
      devient le compte sa, que SQL Server refuse sans mot de passe solide. Le
      second doit reprendre la valeur de admin_mot_de_passe_windows du fichier
      terraform.tfvars : il sert a ouvrir une session complete sur la machine,
      sans laquelle le programme d'installation ne peut pas chiffrer ses
      parametres.

- name: Prerequis .NET installes
  ansible.windows.win_feature:
    name: "{{ pointeuses_windows_fonctionnalites }}"
    state: present
    include_management_tools: true
  register: pointeuses_windows_features

- name: Redemarrage applique si une fonctionnalite l'exige
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: pointeuses_windows_features.reboot_required

- name: Repertoire de travail present
  ansible.windows.win_file:
    path: "{{ pointeuses_windows_sql_repertoire }}"
    state: directory

# force vaut vrai par defaut : sans ce reglage, les 266 Mio de l'installateur
# seraient retelecharges a chaque execution, la tache annoncant changed: false.
- name: Archive SQL Server Express recuperee
  ansible.windows.win_get_url:
    url: "{{ pointeuses_windows_sql_url }}"
    dest: "{{ pointeuses_windows_sql_repertoire }}\\SQLEXPR_x64_ENU.exe"
    checksum: "{{ pointeuses_windows_sql_sha256 | default(omit, true) }}"
    checksum_algorithm: sha256
    force: false

- name: Absence de controle d'integrite signalee
  ansible.builtin.debug:
    msg: >-
      SQL Server Express a ete installe sans verification d'empreinte.
      Relever le SHA-256 du fichier telecharge et renseigner
      pointeuses_windows_sql_sha256.
  when: pointeuses_windows_sql_sha256 | length == 0

- name: Archive extraite
  ansible.windows.win_command: >-
    {{ pointeuses_windows_sql_repertoire }}\SQLEXPR_x64_ENU.exe
    /Q /X:{{ pointeuses_windows_sql_repertoire }}\extrait
  args:
    creates: "{{ pointeuses_windows_sql_repertoire }}\\extrait\\setup.exe"

- name: Moteur SQL installe
  ansible.windows.win_package:
    path: "{{ pointeuses_windows_sql_repertoire }}\\extrait\\setup.exe"
    arguments: >-
      /Q /IACCEPTSQLSERVERLICENSETERMS /ACTION=Install /FEATURES=SQLENGINE
      /INSTANCENAME={{ pointeuses_windows_sql_instance }}
      /SECURITYMODE=SQL /SAPWD="{{ coffre_pointeuses_mot_de_passe }}"
      /SQLSVCACCOUNT="NT AUTHORITY\SYSTEM"
      /SQLSYSADMINACCOUNTS="BUILTIN\Administrators"
      /TCPENABLED=1 /UPDATEENABLED=0
    creates_service: "MSSQL${{ pointeuses_windows_sql_instance }}"
    state: present
  # Le programme d'installation serialise ses reglages en XML et chiffre au
  # passage toute SqlSecureString, dont celle de la configuration de l'Agent,
  # meme vide. ProtectedData.Protect en portee utilisateur ne peut deverrouiller
  # la cle maitresse du profil qu'a partir des identifiants de la session. Une
  # connexion SSH par cle publique produit une ouverture de session de type
  # reseau, qui n'en porte aucun : le chiffrement rend "Access is denied" et
  # l'installation meurt en douze secondes, avant toute copie de fichier.
  #
  # L'elevation est demandee par VARIABLES et non par les mots-cles become.
  # Dans task_executor.py, _set_become_plugin lit ansible_become des variables
  # du hote et ignore purement le mot-cle de la tache des que cette variable
  # existe. Or le groupe windows porte ansible_become: false, ecrit par
  # Terraform. Un "become: true" en mot-cle serait donc inerte, et l'elevation
  # n'aurait jamais lieu. Les variables de tache, elles, priment sur celles du
  # groupe.
  vars:
    ansible_become: true
    ansible_become_method: runas
    ansible_become_user: "{{ ansible_user }}"
    ansible_become_password: "{{ coffre_windows_admin_mot_de_passe }}"
  # Le mot de passe transite dans les arguments : rien ne doit etre journalise.
  no_log: true
  register: pointeuses_windows_sql_resultat
  failed_when: false

# no_log masque tout, y compris le motif d'un echec. Ce controle rend un message
# exploitable sans divulguer les arguments.
- name: Installation de SQL Server aboutie
  ansible.builtin.assert:
    that:
      - not (pointeuses_windows_sql_resultat.failed | default(false))
    fail_msg: >-
      L'installation de SQL Server a echoue avec le code
      {{ pointeuses_windows_sql_resultat.rc | default('inconnu') }}. Le detail
      figure sur la machine dans "C:\Program Files\Microsoft SQL Server\160\
      Setup Bootstrap\Log\Summary.txt".
    success_msg: Moteur SQL Server Express en place.

# Le nom de la cle porte le numero de version, MSSQL16 pour SQL Server 2022.
# Le resoudre evite de le figer et de casser a la prochaine version.
- name: Cle de registre de l'instance resolue
  ansible.windows.win_shell: >-
    (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\Instance Names\SQL').'{{ pointeuses_windows_sql_instance }}'
  register: pointeuses_windows_cle_instance
  changed_when: false
  tags: [pointeuses, base]

# TCPENABLED active le protocole mais ne lui donne aucun port : les deux valeurs
# restent vides et le moteur n'ecoute nulle part. Vider TcpDynamicPorts et poser
# TcpPort impose le port fixe.
- name: Port TCP fixe impose au moteur SQL
  ansible.windows.win_regedit:
    path: >-
      HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\{{ pointeuses_windows_cle_instance.stdout | trim }}\MSSQLServer\SuperSocketNetLib\Tcp\IPAll
    name: "{{ item.nom }}"
    data: "{{ item.valeur }}"
    type: string
  loop:
    - {nom: TcpPort, valeur: "{{ pointeuses_windows_port_sql }}"}
    - {nom: TcpDynamicPorts, valeur: ""}
  loop_control:
    label: "{{ item.nom }} = {{ item.valeur | default('vide') }}"
  notify: Redemarrer le moteur SQL
  tags: [pointeuses, base]

- name: Moteur SQL demarre et permanent
  ansible.windows.win_service:
    name: "MSSQL${{ pointeuses_windows_sql_instance }}"
    start_mode: auto
    state: started

- name: Service de resolution d'instance demarre
  ansible.windows.win_service:
    name: SQLBrowser
    start_mode: auto
    state: started

- name: Ports de la base et des terminaux ouverts
  community.windows.win_firewall_rule:
    name: "labo-pointeuses-{{ item.port }}"
    localport: "{{ item.port }}"
    protocol: "{{ item.protocole }}"
    direction: in
    action: allow
    enabled: true
    profiles: [domain, private, public]
    state: present
  loop: "{{ pointeuses_windows_ports }}"
  loop_control:
    label: "{{ item.nom }} ({{ item.port }}/{{ item.protocole }})"

- name: Absence de l'installateur MorphoManager signalee
  ansible.builtin.debug:
    msg: >-
      Plateforme prete : SQL Server Express {{ pointeuses_windows_sql_version }}
      installe et joignable. MorphoManager n'est pas installe. Renseigner la
      variable pointeuses_windows_installateur_morpho une fois l'abonnement
      obtenu.
  when: pointeuses_windows_installateur_morpho | length == 0
