---
# Durcissement applique a toutes les machines. Un role metier peut ouvrir un
# port supplementaire, jamais en refermer un.

commun_paquets:
  - chrony
  - ufw
  - unattended-upgrades
  - rsyslog
  - qemu-guest-agent
  - curl
  - ca-certificates
  - python3-debian   # requis par le module de gestion des depots
  - htop

commun_syslog_distant: true
commun_syslog_port: 514

# Pose par cloud-init. Le role verifie seulement qu'il n'a pas disparu.
commun_swappiness: 10

commun_ports_ouverts:
  - "22/tcp"

commun_sysctl:
  # Pas de redirection de paquets : ces machines ne sont pas des routeurs.
  net.ipv4.ip_forward: 0
  # Ignorer les redirections ICMP, qui peuvent detourner le trafic.
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  # Refuser les paquets dont l'adresse source est incoherente.
  net.ipv4.conf.all.rp_filter: 1
  # Journaliser les adresses impossibles.
  net.ipv4.conf.all.log_martians: 1
