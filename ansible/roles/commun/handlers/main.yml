---
- name: Redemarrer chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Redemarrer ssh
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Redemarrer rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

# netplan apply ne coupe pas les sessions existantes, contrairement a un
# redemarrage du service reseau.
- name: Appliquer la configuration reseau
  ansible.builtin.command:
    cmd: netplan apply
  changed_when: true
