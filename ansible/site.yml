---
# Configuration complete du laboratoire.
#
#   ansible-playbook site.yml                       tout
#   ansible-playbook site.yml --limit impression    un seul service
#   ansible-playbook site.yml --check --diff        simulation, sans rien changer
#
# Les groupes linux, windows et de role sont ecrits par Terraform.

- name: Preparation commune des machines Linux
  hosts: linux
  gather_facts: true
  roles:
    - commun

- name: Preparation commune des machines Windows
  hosts: windows
  gather_facts: true
  roles:
    - commun_windows

# Xerox Workplace Suite et MorphoManager imposent Windows. Les roles posent la
# plateforme, les produits sous licence viendront ensuite.
- name: Serveur d'impression
  hosts: impression
  gather_facts: true
  roles:
    - impression_windows

- name: Serveur de visioconference
  hosts: visioconference
  gather_facts: true
  roles:
    - visioconference

- name: Serveur de gestion des pointeuses
  hosts: pointeuses
  gather_facts: true
  roles:
    - pointeuses_windows

# En dernier : la supervision declare les autres machines, qui doivent donc
# deja etre configurees.
- name: Supervision Centreon
  hosts: supervision
  gather_facts: true
  roles:
    - supervision

# Les pare-feux se configurent depuis le poste d'administration, par leur API.
- name: Pare-feu peripherique Fortinet
  hosts: fortinet
  gather_facts: false
  connection: local
  # Le playbook tourne sur le poste d'administration : aucune elevation locale
  # n'est requise pour dialoguer avec l'API du pare-feu.
  become: false
  roles:
    - parefeu_fortinet

- name: Pare-feu interne Palo Alto
  hosts: paloalto
  gather_facts: false
  connection: local
  become: false
  roles:
    - parefeu_paloalto
