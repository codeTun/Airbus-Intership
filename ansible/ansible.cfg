[defaults]
inventory            = inventaire/hosts.yml
roles_path           = roles
collections_path     = collections
host_key_checking    = False

# Cle dediee au laboratoire, distincte de celle du poste. Sans cette ligne
# Ansible n'essaie que les noms par defaut et se voit refuser l'acces.
# Surchargeable par ANSIBLE_PRIVATE_KEY_FILE.
private_key_file     = ~/.ssh/id_ed25519_labo
interpreter_python   = /usr/bin/python3
# Rendu YAML des resultats. Le greffon community.general.yaml qui rendait ce
# service a ete supprime : ansible-core sait le faire seul depuis la 2.13.
stdout_callback      = default
result_format        = yaml
callbacks_enabled    = profile_tasks, timer
force_handlers       = True
retry_files_enabled  = False
display_skipped_hosts = False
nocows               = 1

# Les machines viennent d'etre creees : leur empreinte SSH change a chaque
# reconstruction du laboratoire, il ne sert a rien de la memoriser.

[ssh_connection]
pipelining  = True
ssh_args    = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False
